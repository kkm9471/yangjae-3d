# web/ 폴더를 GitHub Pages 에 올린다.
#
# 이 프로젝트는 빌드 단계가 없다(three.js 를 vendor/ 에 직접 넣어 두고 importmap 으로 쓴다).
# 그래서 web/ 을 그대로 올리면 끝이다. main 에 push 할 때마다 자동으로 올라간다.
#
# 주의: 지도 데이터(web/data/places/**)도 같이 올라간다. 동네가 늘면 용량과 파일 수가
#       같이 는다. 한 동네가 대략 1.1MB / 파일 460개다.

name: 웹에 올리기

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:          # 손으로도 돌릴 수 있게

permissions:
  contents: read
  pages: write
  id-token: write

# 여러 번 밀어도 마지막 것만 올린다(앞의 것은 취소)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 올릴 것 확인
        run: |
          echo "용량:"; du -sh web
          echo "파일 수: $(find web -type f | wc -l)"
          test -f web/index.html || { echo "web/index.html 이 없습니다"; exit 1; }

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
